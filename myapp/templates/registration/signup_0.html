<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4 style-container" style="max-width: 450px; width: 100%;">
        <h2 class="card-title text-center text-primary mb-4">Create Account</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Register & Log In</button>
        </form>
        <hr class="text-muted">
        <p class="text-center mb-0 text-secondary">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-semibold">Log In here</a></p>
    </div>
    <!--/home/kamusk/mysite/myapp/templates/registration/signup.html-->
</body>
</html>
