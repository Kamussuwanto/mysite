<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create an Account</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        .form-group { margin-bottom: 15px; }
        .login-link { display: block; margin-top: 15px; text-decoration: none; color: blue; }
    </style>
</head>
<body>
    <h2>Sign Up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register Account</button>
    </form>
    <a class="login-link" href="{% url 'login' %}">Already have an account? Log in here</a>
</body>
</html>
