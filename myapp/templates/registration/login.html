<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4 style-container" style="max-width: 400px; width: 100%;">
        <h2 class="card-title text-center text-primary mb-4">Welcome Back</h2>

        {% if form.errors %}
            <div class="alert alert-danger py-2 text-center" role="alert">
                Username or password didn't match.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Log In</button>
        </form>
        <hr class="text-muted">
        <p class="text-center mb-0 text-secondary">Need an account? <a href="{% url 'signup' %}" class="text-decoration-none fw-semibold">Sign Up here</a></p>
    </div>
    <!--/home/kamusk/mysite/myapp/templates/registration/login.html-->

</body>
</html>
